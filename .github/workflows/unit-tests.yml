name: Unit tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-agent.txt openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
# CI unit checks do not exercise Docker, HDFS, Spark or the local GPU/model.
