name: Unit tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check --select F,E9 jobs/input_guard.py jobs/conversation.py jobs/chart_data.py jobs/agent_tools.py jobs/mcp_server.py jobs/web_app.py jobs/dashboard.py
      - run: mypy --follow-imports=skip --ignore-missing-imports --disallow-untyped-defs jobs/input_guard.py jobs/conversation.py jobs/chart_data.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_chart_render.cjs
      - run: python -m unittest discover -s tests -v
# CI unit checks do not exercise Docker, HDFS, Spark or the local GPU/model.
