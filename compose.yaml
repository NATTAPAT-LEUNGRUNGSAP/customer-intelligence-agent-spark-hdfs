name: customer-intelligence
x-hadoop: &hadoop
  build: ./infra/hadoop
  environment:
    HADOOP_CONF_DIR: /config
  volumes:
    - ./infra/hadoop/config:/config:ro
  restart: unless-stopped
services:
  namenode:
    <<: *hadoop
    hostname: namenode
    command: ["bash", "/entrypoint.sh", "namenode"]
    volumes:
      - ./infra/hadoop/config:/config:ro
      - namenode-data:/data/name
    ports: ["127.0.0.1:9870:9870"]
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfs -ls / >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 18
  datanode-1:
    <<: *hadoop
    hostname: datanode-1
    command: ["bash", "/entrypoint.sh", "datanode"]
    volumes:
      - ./infra/hadoop/config:/config:ro
      - datanode-1-data:/data/data
    depends_on:
      namenode: {condition: service_healthy}
  datanode-2:
    <<: *hadoop
    hostname: datanode-2
    command: ["bash", "/entrypoint.sh", "datanode"]
    volumes:
      - ./infra/hadoop/config:/config:ro
      - datanode-2-data:/data/data
    depends_on:
      namenode: {condition: service_healthy}
  spark-master:
    image: apache/spark:4.1.3-scala2.13-java17-python3-r-ubuntu
    hostname: spark-master
    entrypoint: ["/opt/spark/bin/spark-class"]
    command: ["org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports: ["127.0.0.1:8080:8080"]
  spark-worker:
    image: apache/spark:4.1.3-scala2.13-java17-python3-r-ubuntu
    entrypoint: ["/opt/spark/bin/spark-class"]
    command: ["org.apache.spark.deploy.worker.Worker", "--cores", "2", "--memory", "1g", "spark://spark-master:7077"]
    depends_on: [spark-master]
    volumes:
      - ./data:/app/data:ro
  spark-job:
    build: ./infra/spark
    hostname: spark-job
    profiles: ["jobs"]
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command: ["--master", "spark://spark-master:7077", "--conf", "spark.driver.host=spark-job", "--conf", "spark.driver.bindAddress=0.0.0.0", "--conf", "spark.executor.memory=512m", "/app/jobs/smoke_hdfs.py"]
    volumes:
      - ./jobs:/app/jobs:ro
      - ./data:/app/data:ro
      - ./reports:/app/reports
      - ./sql:/app/sql:ro
      - ./knowledge:/app/knowledge:ro
      - ./evaluation:/app/evaluation:ro
      - ./tests:/app/tests:ro
      - ./infra/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./infra/spark:/app/infra/spark:ro
      - ./infra/hadoop/config:/app/infra/hadoop/config:ro
      - ./compose.yaml:/app/compose.yaml:ro
      - ./requirements-agent.txt:/app/requirements-agent.txt:ro
    depends_on:
      namenode: {condition: service_healthy}
      spark-worker: {condition: service_started}
  prepare-data:
    build: ./infra/spark
    profiles: ["jobs"]
    entrypoint: ["python3", "/app/jobs/prepare_data.py"]
    volumes:
      - ./jobs:/app/jobs:ro
      - ./data:/app/data
volumes:
  namenode-data:
  datanode-1-data:
  datanode-2-data:
