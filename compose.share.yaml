services:
  friend-gateway:
    image: caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    profiles: [share]
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./infra/share/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.private/friend-auth.caddy:/secrets/auth.caddy:ro
    read_only: true
    tmpfs: [/config, /data, /tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    # No host port: only the tunnel reaches this password-protected gateway.
  friend-tunnel:
    image: cloudflare/cloudflared@sha256:c6c7ae1d5dfdcb094ad344ed68ccffc26635c9c6be80965664c33baf064b0515
    profiles: [share]
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--url", "http://friend-gateway:8081"]
    depends_on: [friend-gateway]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Intentionally no restart policy: temporary sharing is explicitly started.
